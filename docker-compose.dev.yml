services:
  app-dev:
    image: node:20-alpine
    container_name: adminhub-web-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    networks:
      - adminhub-network

networks:
  adminhub-network:
    driver: bridge
